# Modelo de secrets.yaml. Copialo como secrets.yaml (en esta misma carpeta) y completá tus valores.
# secrets.yaml nunca se sube a GitHub: está en .gitignore.

wifi_ssid: "NombreDeTuWiFi"          # tiene que ser de 2,4 GHz
wifi_password: "ClaveDeTuWiFi"
ap_password: "acuario1234"           # WiFi de rescate «AquaControl-Setup» si la central no encuentra el tuyo
ota_password: "otra-clave-cualquiera"

# Bot de Telegram (manual, etapa 0)
telegram_url: "https://api.telegram.org/botTOKEN/sendMessage"
telegram_chat: "123456789"

# EMQX Cloud: Overview → Address, y el usuario «central» de Access Control → Authentication
mqtt_broker: "xxxxxxxx.ala.eu-central-1.emqxsl.com"
mqtt_user_central: "central"
mqtt_password_central: "ClaveDelUsuarioCentral"

# Historial en Supabase (webapp/README.md → «Cuenta»). Sin internet, esa lectura se pierde y listo.
supabase_lectura_url: "https://xxxxxxxx.supabase.co/rest/v1/rpc/registrar_lectura"
supabase_key: "sb_publishable_xxxxxxxx"            # la misma publishable key de la app
supabase_clave_central: "ClaveLargaDeLaCentral"    # la de supabase/cargar-central.sql
