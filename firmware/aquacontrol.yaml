esphome:
  name: aquacontrol
  friendly_name: AquaControl
  build_path: C:/esphome-build/aquacontrol   # compilar fuera de OneDrive: la ruta con coma rompe el enlazado

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "AquaControl-Setup"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3
  js_include: aquacontrol_app.js   # la app (pantallas de tablet y móvil); se genera con python app/build_app.py
  js_url: ""                           # sin la página de ESPHome; sigue en http://aquacontrol.local/?esphome

