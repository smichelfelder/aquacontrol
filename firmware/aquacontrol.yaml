http_request:
  verify_ssl: true

time:
  - platform: sntp
    id: hora
    timezone: Europe/Madrid

script:
  - id: aviso
    mode: queued
    parameters:
      texto: string
    then:
      - http_request.post:
          url: !secret telegram_url
          request_headers:
            Content-Type: application/json
          json:
            chat_id: !secret telegram_chat
            text: !lambda 'return texto;'

button:
  - platform: template
    name: "Probar aviso de Telegram"
    on_press:
      - script.execute:
          id: aviso
          texto: "AquaControl: los avisos funcionan"

# Rango de temperatura aceptable: se cambia desde la app («Mi acuario») y queda guardado en la
# central, así los avisos siguen funcionando aunque no haya ninguna app abierta.
number:
  - platform: template
    id: temp_min
    name: "Temperatura mínima"
    unit_of_measurement: "°C"
    min_value: 15
    max_value: 35
    step: 0.5
    initial_value: 24
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: temp_max
    name: "Temperatura máxima"
    unit_of_measurement: "°C"
    min_value: 15
    max_value: 35
    step: 0.5
    initial_value: 27
    restore_value: true
    optimistic: true
    entity_category: config

globals:
  - id: temp_fuera   # -1: avisó que está baja · 1: avisó que está alta · 0: en rango
    type: int
    initial_value: "0"

one_wire:
  - platform: gpio
    pin: GPIO4

sensor:
  - platform: dallas_temp
    id: temp_agua
    name: "Temperatura"
    update_interval: 60s
    filters:
      - offset: 0.0   # ajuste fino, ver «Pruebas»
    on_value:
      # Un aviso al salir del rango; vuelve a avisar recién después de haber vuelto a él
      # (con 0,2 °C de margen, para que no lleguen avisos seguidos si oscila justo en el límite).
      - if:
          condition:
            lambda: 'return x < id(temp_min).state && id(temp_fuera) != -1;'
          then:
            - globals.set: { id: temp_fuera, value: "-1" }
            - script.execute:
                id: aviso
                texto: !lambda 'return str_sprintf("Temperatura baja: %.1f °C (mínimo %.1f °C). Revisá el calentador", x, id(temp_min).state);'
      - if:
          condition:
            lambda: 'return x > id(temp_max).state && id(temp_fuera) != 1;'
          then:
            - globals.set: { id: temp_fuera, value: "1" }
            - script.execute:
                id: aviso
                texto: !lambda 'return str_sprintf("Temperatura alta: %.1f °C (máximo %.1f °C). Revisá el calentador y la luz", x, id(temp_max).state);'
      - if:
          condition:
            lambda: 'return x >= id(temp_min).state + 0.2 && x <= id(temp_max).state - 0.2;'
          then:
            - globals.set: { id: temp_fuera, value: "0" }

interval:   # historial: cada 5 min la central deja una lectura en Supabase (webapp/supabase/esquema.sql)
  - interval: 5min
    then:
      - if:
          condition:
            lambda: 'return !std::isnan(id(temp_agua).state);'
          then:
            - http_request.post:
                url: !secret supabase_lectura_url
                request_headers:
                  Content-Type: application/json
                  apikey: !secret supabase_key
                json:
                  clave: !secret supabase_clave_central
                  temp: !lambda 'return str_sprintf("%.2f", id(temp_agua).state);'
